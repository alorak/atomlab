<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f6f8">
  <meta name="description" content="118 elementlik etkileşimli periyodik tablo ve Atom Laboratuvarı kartları.">
  <title>Atom Laboratuvarı</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
  <script src="./mission-visuals.js" defer></script>
  <script src="./missions.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <div class="brand"><span class="brand-icon" aria-hidden="true">⚛</span><strong>Atom Laboratuvarı</strong></div><nav class="top-nav" aria-label="Bölümler"><button class="top-tab active" data-view="periodic" aria-pressed="true">Periyodik Tablo</button><button class="top-tab" data-view="missions" aria-pressed="false">Görevler</button></nav>
    </header>
    <main id="periodic-view" class="workspace">
      <section class="table-panel" aria-label="Periyodik tablo">
        <div class="toolbar">
          <label class="search"><span aria-hidden="true">⌕</span><input id="periodic-search" type="search" placeholder="Element ara (ad, sembol, numara)" aria-label="Element ara"></label>
          <label class="toggle"><input id="only-available" type="checkbox"> Kart setini vurgula</label>
        </div>
        <div class="periodic-scroller" role="region" aria-label="Yatay kaydırılabilir periyodik tablo" tabindex="0">
          <div id="periodic-grid" class="periodic-grid"></div>
        </div>
        <div class="legend">
          <span><i class="swatch nonmetal"></i>Ametal</span>
          <span><i class="swatch metal"></i>Metal</span>
          <span><i class="swatch noble"></i>Soygaz</span>
          <span><i class="swatch metalloid"></i>Yarımetal</span>
          <span class="legend-muted">Soluk elementler: sanal kart</span>
        </div>
      </section>
      <aside class="inspector" id="inspector" aria-label="Seçilen atomun kartı">
        <div class="inspector-header">
          <strong>Seçilen atom</strong>
          <span id="card-status" class="card-status" role="status"></span>
        </div>
        <div id="atom-preview" class="atom-preview"></div>
        <dl class="atom-facts">
          <div><dt>Element</dt><dd id="detail-title"></dd></div>
          <div><dt>Elektron dağılımı</dt><dd id="detail-shells"></dd></div>
          <div><dt>Grup</dt><dd id="detail-group"></dd></div>
          <div><dt>Sınıf</dt><dd id="detail-type"></dd></div>
        </dl>
        <p id="detail-description" class="detail-description"></p>
        <p class="science-note">Elektron kabukları öğretici şemadır; noktalar elektronların gerçek konumları değildir.</p>
      </aside>
    </main>
    <main id="missions-view" class="missions-view" hidden>
      <div class="missions-top"><div class="mission-stage-tabs" id="mission-stage-tabs" role="group" aria-label="Görev aşamaları"></div><span id="mission-count" class="mission-count"></span></div>
      <div class="missions-layout">
        <section class="mission-list" id="mission-list" aria-label="Görev kartları"></section>
        <aside class="mission-detail" id="mission-detail" aria-live="polite"></aside>
      </div>
    </main>
  </div>
</body>
</html>
